<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 48" fill="none" class="rehome-logo">
  <!-- Square badge with rounded corners #006B2C -->
  <rect x="2" y="2" width="44" height="44" rx="12" fill="#006B2C" />
  
  <!-- Circular Recycle Arrows flanking the t-shirt -->
  <!-- Top arrow curving clockwise -->
  <path d="M 16 16 C 18 11, 30 11, 32 16" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" fill="none" />
  <polyline points="30 11 33 16 28 17" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="1" stroke-linejoin="round" />
  
  <!-- Bottom arrow curving clockwise -->
  <path d="M 32 32 C 30 37, 18 37, 16 32" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" fill="none" />
  <polyline points="18 37 15 32 20 31" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="1" stroke-linejoin="round" />
  
  <!-- White T-shirt in center -->
  <path d="M 19 19 L 22 17 C 23 18.5, 25 18.5, 26 17 L 29 19 L 27.5 22 L 25.8 21.2 L 25.8 30.5 L 22.2 30.5 L 22.2 21.2 L 20.5 22 Z" fill="#FFFFFF" />

  <!-- "ReHome" Text on the right -->
  <text x="56" y="32" font-family="'Be Vietnam Pro', sans-serif" font-size="24" font-weight="800" fill="#006B2C" letter-spacing="-0.5">ReHome</text>
</svg>
